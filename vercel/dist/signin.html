<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · ReleaseRadar</title><link rel="stylesheet" href="site-calm.css"><style>body{font-family:system-ui;background:#f5f7fc;color:#18243e;margin:0}main{max-width:440px;margin:8vh auto;padding:32px;background:white;border:1px solid #dfe5f0;border-radius:24px;box-shadow:0 14px 45px #23356412}label,input{display:block}input{box-sizing:border-box;width:100%;margin:8px 0 20px;padding:12px;border:1px solid #cad3e4;border-radius:10px;font:inherit}button{padding:12px 18px;border:0;border-radius:10px;background:#6759ba;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.5}p{line-height:1.6}a{color:#6759ba}#status{min-height:3em}@media(max-width:500px){main{margin:20px;padding:24px}}</style></head><body><main><a href="/">← ReleaseRadar</a><h1>Your testing workspace.</h1><p>Sign in to keep your Jira and API connections private. Local stories and sessions stay in this browser.</p><form id="account-form"><label for="email">Email</label><input id="email" type="email" autocomplete="username" maxlength="320" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="8" maxlength="256" required><button type="submit" id="signin">Sign in</button> <button type="button" id="signup">Create account</button></form><p id="status" role="status" aria-live="polite"></p><button id="signout" hidden>Sign out</button><p>Moving from the previous site? Export your testing workspace there, then import it here. Reconnect Jira and OAuth accounts after signing in.</p></main><script type="module" src="signin.js"></script></body></html>
